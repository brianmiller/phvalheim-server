<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon for the Flatpak bundle in the client download popover. Drawn here rather than
  shipping the upstream Flatpak trademark: an isometric package, in the same 32x32 box
  as win11.png / ubuntu.png / fedora.png, which the popover renders under
  .client_download_os_icon img (32x32, brightness 75%, 110% on hover). Flat fills only,
  because the brightness filter is applied to the whole image and gradients would band.

  Keep this comment free of a doubled hyphen. XML forbids one inside a comment, and the
  first version of this file shipped with one: the file was present, it was the right
  size, and every browser refused to draw it. See marker ws in buildRcDetached.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <g stroke-linejoin="round" stroke-width="1.6">
    <!-- top face -->
    <path d="M16 2.6 L28.6 9.3 L16 16 L3.4 9.3 Z" fill="#8cbce8" stroke="#8cbce8"/>
    <!-- left face -->
    <path d="M3.4 9.3 L16 16 L16 29.4 L3.4 22.7 Z" fill="#4a86c8" stroke="#4a86c8"/>
    <!-- right face -->
    <path d="M28.6 9.3 L16 16 L16 29.4 L28.6 22.7 Z" fill="#33648f" stroke="#33648f"/>
  </g>
</svg>
