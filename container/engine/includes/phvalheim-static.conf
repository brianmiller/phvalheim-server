#!/bin/bash

function SQL(){
        /usr/bin/mysql --skip-column-names -uroot --database=phvalheim -e "$1"
}

# Is the backup directory a dedicated mount of its own?
#
# Ask the mount table, never device identity. Two bind mounts can share one
# device and still be different storage: on Unraid every /mnt/user share is the
# same FUSE 'shfs' device, so df's source column reads "shfs" for all of them
# while each share reports its own size. Comparing devices there marks a
# correctly-mounted backup volume as shared and silently disables automatic
# backups.
#
# Must agree with isBackupPathMounted() in nginx/www/includes/db_gets.php — the
# admin UI and the scheduler have to reach the same verdict, or the UI shows a
# dedicated volume while backups never run.
function isBackupPathMounted(){
        local path="${1:-$backupDir}"
        if command -v mountpoint >/dev/null 2>&1; then
                mountpoint -q "$path" 2>/dev/null
                return $?
        fi
        awk -v p="$path" '$5 == p { found = 1 } END { exit !found }' /proc/self/mountinfo 2>/dev/null
}

worldsDirectoryRoot="/opt/stateful/games/valheim/worlds"
tsModsDir="/opt/stateful/games/valheim/mods/ts"
worldSupervisorConfigs="/opt/stateful/games/supervisor/conf.d"
backupDir="/opt/stateful/backups"
# Catalogue API endpoints are NOT here. They live in modSync.py (SOURCES), where each one
# sits next to its own change-detection rule -- Thunderstore has Last-Modified, Hexium has
# no validator and needs a body hash. Splitting the URL from that rule is how you end up
# with a source that is fetched but never correctly compared.
#
# These two remain because the engine still uses them directly: the download template is
# what dbUpdate_2.43.sh rebuilds pre-2.43 download URLs from, and the BepInEx endpoint is
# read by InstallAndUpdateBepInEx().
tsModDownloadUrl="https://thunderstore.io/package/download"
tsJsonBepInExUrl="https://thunderstore.io/api/experimental/package/denikson/BepInExPack_Valheim/"

# Required mods for all worlds. Installed during world creation and world updates.
#
# Named as source|owner|name, NOT by uuid. The old list held three tsmods uuids, and a
# uuid cannot identify a mod once there is more than one catalogue: Hexium mirrors
# Thunderstore packages carrying their ORIGINAL uuid4, so 600 package uuids exist in both
# catalogues. (owner,name) plus the source is the only stable identity.
#
# These three are PhValheim's own infrastructure, not user choices -- the Companion feeds
# the web UI, QuickConnect is how a client actually joins a modded world, and
# serverblankpassword is what lets a modded world run with CITIZENS access instead of a
# password. Pinned to thunderstore because that is where they are published; if one cannot
# be resolved the engine says so loudly rather than quietly building a world that cannot
# be joined.
requiredMods="thunderstore|posixone|PhValheimCompanion thunderstore|bdew|QuickConnect thunderstore|1010101110|serverblankpassword"
