#!/bin/bash

function SQL(){
        /usr/bin/mysql --skip-column-names -uroot --database=phvalheim -e "$1"
}

# Is the backup directory a dedicated mount of its own?
#
# Ask the mount table, never device identity. Two bind mounts can share one
# device and still be different storage: on Unraid every /mnt/user share is the
# same FUSE 'shfs' device, so df's source column reads "shfs" for all of them
# while each share reports its own size. Comparing devices there marks a
# correctly-mounted backup volume as shared and silently disables automatic
# backups.
#
# Must agree with isBackupPathMounted() in nginx/www/includes/db_gets.php — the
# admin UI and the scheduler have to reach the same verdict, or the UI shows a
# dedicated volume while backups never run.
function isBackupPathMounted(){
        local path="${1:-$backupDir}"
        if command -v mountpoint >/dev/null 2>&1; then
                mountpoint -q "$path" 2>/dev/null
                return $?
        fi
        awk -v p="$path" '$5 == p { found = 1 } END { exit !found }' /proc/self/mountinfo 2>/dev/null
}

worldsDirectoryRoot="/opt/stateful/games/valheim/worlds"
tsModsDir="/opt/stateful/games/valheim/mods/ts"
worldSupervisorConfigs="/opt/stateful/games/supervisor/conf.d"
backupDir="/opt/stateful/backups"
# Catalogue API endpoints are NOT here. They live in modSync.py (SOURCES), where each one
# sits next to its own change-detection rule -- Thunderstore has Last-Modified, Hexium has
# no validator and needs a body hash. Splitting the URL from that rule is how you end up
# with a source that is fetched but never correctly compared.
#
# These two remain because the engine still uses them directly: the download template is
# what dbUpdate_2.43.sh rebuilds pre-2.43 download URLs from, and the BepInEx endpoint is
# read by InstallAndUpdateBepInEx().
tsModDownloadUrl="https://thunderstore.io/package/download"
tsJsonBepInExUrl="https://thunderstore.io/api/experimental/package/denikson/BepInExPack_Valheim/"

# Required mods for all worlds. Installed during world creation and world updates.
#
# Named as source|owner|name, NOT by uuid. The old list held three tsmods uuids, and a
# uuid cannot identify a mod once there is more than one catalogue: Hexium mirrors
# Thunderstore packages carrying their ORIGINAL uuid4, so 600 package uuids exist in both
# catalogues. (owner,name) plus the source is the only stable identity.
#
# These are PhValheim's own infrastructure, not user choices. Pinned to thunderstore because
# that is where they are published; if one cannot be resolved the engine says so loudly rather
# than quietly building a world that cannot be joined.
#
# The list is EMPTY as of 2.53, and both removals have the same cause -- the bundled Companion.
#
# The Companion itself left because it ships inside the image and is installed by
# installSystemPlugins(), so it is no longer resolved from a catalogue at all.
#
# serverblankpassword left because it was never doing anything. It patches out Valheim's
# server-side password requirement, but that requirement is enforced in
# FejdStartup.ParseServerArguments only when -public is set, and startWorld.sh has always
# started a modded world with `-public 0`. Now that a modded world can have a real password
# (access control stopped being coupled to world type in 2.53) keeping a mod that suppresses
# password enforcement would be actively wrong, not merely redundant.
#
# Removing an entry here only stops NEW worlds getting it -- mergeRequiredTsMods() only ever
# INSERTs, so existing worlds keep their world_mods row until something deletes it. See the
# one-time retirement block in dbUpdates/dbUpdate_2.53.sh.
#
# Keep the key even when empty: the loop in mergeRequiredTsMods() handles an empty list
# correctly, and build-time verify markers grep for the assignment itself.
requiredMods=""

# The oldest PhValheim client that can join a world updated by THIS server.
#
# 2.0.14 is the first client that passes --phvalheim-launch, and from 2.53 that argument is
# the only way a world's password reaches the Companion. An older client receives the launch
# string from the web UI and simply has nowhere to put it, so it starts Valheim with no
# payload: no connect dialog, no password, and no QuickConnect server-list entry either.
#
# Written into every client payload by writeClientManifest() so the Companion can say so on
# the player's screen. It is a constant rather than a column because it is a property of the
# server's code, not of a world or an operator's choice -- the version that introduced the
# handoff cannot change without a code change here.
clientMinVersion="2.0.14"

# QuickConnect moved OUT of requiredMods in 2.53 and is now conditional. See
# companionSupportsConnect() in 0-functions.sh and docs/RELEASE-2.53-DESIGN.md.
#
# It is still installed on every modded world today. It stops being installed the moment the
# bundled Companion can do the connecting itself.
legacyConnectMods="thunderstore|bdew|QuickConnect"

# Does the Companion shipped in THIS image know how to connect a player to a world by itself?
#
# 0 = not yet. QuickConnect is still installed and still writes its config.
# 1 = yes. QuickConnect stops being installed on newly built worlds.
#
# Bundling the Companion (2.53) deleted the reason this used to be a catalogue lookup: the
# server and the Companion are now one artifact, so the answer is a property of the build
# rather than something to interrogate mod_versions about. What it replaces --
# companionConnectMinVersion, companionModIdentity, versionAtLeast() and a SQL probe -- all
# existed solely to cope with a separately-published mod drifting from the server.
#
# It is STILL A FLAG rather than a deletion, and that is the important part. A required mod
# missing from the catalogue only produces a [WARN] from mergeRequiredTsMods() and the world
# is then built WITHOUT it -- so retiring QuickConnect before the Companion can actually
# connect would produce modded worlds with NO WAY TO JOIN THEM and only a warning to show for
# it. Flip this to 1 in the same change that lands the Companion's connect support, never
# before, and never as a guess.
#
# VERIFIED 2026-10-01 on a real Valheim client. Brian joined modded world 'test123' on
# 37648-phvalheim1 through the Companion dialog, including a crossplay-enabled world. That
# real-client run was the gate -- no static check could have cleared it, because the Companion
# compiles against assembly_valheim_publicized.dll where every member is public, so a call to
# a Valheim private builds with zero warnings and throws only when a player clicks the button.
#
# Flipping this to 1 is what retires QuickConnect. It needs no separate removal step: an
# update runs purgeWorldModsConfigsPatchers(), which clears BepInEx/plugins on BOTH the server
# tree and the client staging tree before reinstalling, so a mod that is no longer in the
# effective list simply does not come back.
companionProvidesConnect="1"
