#!/bin/bash

function SQL(){
        /usr/bin/mysql --skip-column-names -uroot --database=phvalheim -e "$1"
}

# Is the backup directory a dedicated mount of its own?
#
# Ask the mount table, never device identity. Two bind mounts can share one
# device and still be different storage: on Unraid every /mnt/user share is the
# same FUSE 'shfs' device, so df's source column reads "shfs" for all of them
# while each share reports its own size. Comparing devices there marks a
# correctly-mounted backup volume as shared and silently disables automatic
# backups.
#
# Must agree with isBackupPathMounted() in nginx/www/includes/db_gets.php — the
# admin UI and the scheduler have to reach the same verdict, or the UI shows a
# dedicated volume while backups never run.
function isBackupPathMounted(){
        local path="${1:-$backupDir}"
        if command -v mountpoint >/dev/null 2>&1; then
                mountpoint -q "$path" 2>/dev/null
                return $?
        fi
        awk -v p="$path" '$5 == p { found = 1 } END { exit !found }' /proc/self/mountinfo 2>/dev/null
}

