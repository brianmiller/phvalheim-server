{# Keep the theme's source component so its GitHub stars/forks still update. #}
<div class="phv-source-metrics">
  <a href="{{ config.repo_url }}" title="{{ lang.t('source') }}" class="md-source" data-md-component="source">
    <div class="md-source__icon md-icon">
      {% set icon = config.theme.icon.repo or "fontawesome/brands/git-alt" %}
      {% include ".icons/" ~ icon ~ ".svg" %}
    </div>
    <div class="md-source__repository">{{ config.repo_name }}</div>
  </a>
  <a class="phv-docker-pulls" href="https://hub.docker.com/r/theoriginalbrian/phvalheim-server" aria-label="View total pulls for PhValheim Server on Docker Hub">
    <img src="https://img.shields.io/docker/pulls/theoriginalbrian/phvalheim-server?logo=docker&amp;logoColor=white&amp;label=total%20pulls&amp;labelColor=25243f&amp;color=23bdcf&amp;cacheSeconds=3600" alt="Docker Hub total pulls" height="20" referrerpolicy="no-referrer">
  </a>
</div>
