<!doctype html><html lang="en"><meta charset="utf-8"><title>PhValheim — host, mod, sync, play</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091518;color:#f5f2e9;font-family:system-ui,sans-serif;width:720px;height:1280px;overflow:hidden}#stage{position:relative;width:720px;height:1280px;padding:48px 42px;background:radial-gradient(ellipse at 100% 0%,#aa794b35,transparent 58%),radial-gradient(ellipse at 0 90%,#3c9d9535,transparent 60%),#0b191e}.brand{display:flex;align-items:center;gap:14px;font-size:20px;letter-spacing:4px;font-weight:850;color:#e6ceb0}.brand img{width:40px;height:40px}.edition{position:absolute;right:42px;top:58px;font-size:17px;color:#9eccc4}.frame{position:absolute;inset:20px;border:1px solid #dcb36d20;pointer-events:none}.frame:before,.frame:after{content:'◆';position:absolute;color:#d3ad6a;top:-13px;font-size:18px}.frame:before{left:-7px}.frame:after{right:-7px}.scene{position:absolute;inset:151px 42px 116px;opacity:0;transform:translateY(24px);transition:opacity .27s,transform .4s;pointer-events:none}.scene.active{opacity:1;transform:none}.step{font-size:18px;letter-spacing:2.5px;font-weight:750;text-transform:uppercase;color:#7fd4c7}h1{font-size:64px;line-height:1.06;letter-spacing:-2.7px;margin:22px 0 22px;font-weight:850}em{font-style:normal;color:#e8bd77}.sub{font-size:25px;line-height:1.45;color:#c2d0ce;margin:0 0 28px}.art{height:590px;position:relative}.note{font-size:22px;line-height:1.4;color:#d6dfdb;border-left:3px solid #cfa76a;padding:13px 18px;margin-top:22px;background:#cfa76a0a}.shot{border:1px solid #d2ad704d;border-radius:18px;overflow:hidden;background:#10192a;box-shadow:0 22px 50px #0005;position:relative}.shot img{display:block;width:100%;height:auto}.shot.tall{height:510px}.shot.tall img{width:100%;height:100%;object-fit:cover;object-position:top}.shot.config{height:500px}.shot.config img{width:100%;height:auto;transform:translateY(-205px)}.shot.world{margin:30px 0;height:146px}.shot.world img{width:1260px;max-width:none;position:absolute;left:-20px;top:35px}.shot.backups{height:auto;margin-bottom:16px}.shot.backups img{height:auto}.shot.vibes{height:410px}.shot.vibes img{width:1270px;max-width:none;position:absolute;top:-15px;left:-165px}.shot.package{height:350px}.shot.package img{width:1120px;max-width:none;position:absolute;left:-220px;top:-170px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tile{padding:22px 20px;border:1px solid #8da9a338;border-radius:16px;background:#16282e;font-size:24px;font-weight:750}.tile small{display:block;font-size:18px;line-height:1.4;color:#afc5c1;font-weight:450;margin-top:6px}.stack{display:flex;flex-direction:column;gap:14px}.flow{position:relative;background:#142b30;border:1px solid #64bfa859;border-radius:18px;padding:24px;font-size:27px;font-weight:760;display:flex;align-items:center;gap:20px}.flow b{border:1px solid #cfaa69;color:#e5bc7b;border-radius:50%;width:45px;height:45px;display:grid;place-items:center;font-size:20px;flex-shrink:0}.flow small{display:block;color:#a9c5c0;font-size:19px;font-weight:450;margin-top:4px}.arrow{text-align:center;font-size:26px;color:#d3ae72;line-height:1}.tagrow{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tag{border:1px solid #8dc5bc60;background:#1a3438;border-radius:30px;padding:10px 16px;color:#a7e1d4;font-size:18px;font-weight:650}.hero-bird{width:218px;display:block;margin:35px auto 26px;filter:drop-shadow(0 0 40px #b29bff3b)}.crest{position:relative;display:grid;place-items:center;width:290px;height:290px;margin:30px auto 28px;border:1px solid #cba66a66;border-radius:50%;background:radial-gradient(#458a7f30,transparent 70%)}.crest:before{content:'';position:absolute;inset:16px;border:1px dashed #e2bb7855;border-radius:50%}.crest img{width:158px;filter:drop-shadow(0 0 30px #5ce5db55)}.strap{text-align:center;font-size:29px;font-weight:750;letter-spacing:3px;color:#d5b57d}.url{font-size:24px;line-height:1.5;text-align:center;margin-top:20px;color:#c3ddd5}.credit{font-size:15px;line-height:1.45;color:#99aca8;text-align:center;margin-top:25px}.footer{position:absolute;bottom:57px;left:42px;right:42px;display:flex;justify-content:space-between;font-size:14px;color:#9eb7b2;letter-spacing:.5px}.progress{position:absolute;bottom:35px;left:42px;width:636px;display:flex;gap:5px;height:4px}.progress i{background:#e1b77825;flex:1;border-radius:2px;overflow:hidden}.progress i b{height:100%;display:block;background:#dfba7c;width:0}.active .crest{animation:crest 5s ease-out both}.active .hero-bird{animation:hop .7s ease-in-out infinite alternate}.active .flow{animation:enter .5s both}.active .flow:nth-of-type(2){animation-delay:.35s}.active .flow:nth-of-type(3){animation-delay:.7s}.active .flow:nth-of-type(4){animation-delay:1.05s}.active .shot{animation:enter .55s both}@keyframes enter{from{opacity:.2;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes hop{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(4deg) translateY(-7px)}}@keyframes crest{from{transform:scale(.9)}to{transform:scale(1)}}
.active .shot.world img{animation:pan-world 5s ease-in-out both}@keyframes pan-world{0%,18%{left:-20px}70%,100%{left:-350px}}</style>
<div id="stage"><div class="frame"></div><div class="brand"><img src="../docs/assets/favicon.svg" alt="">PHVALHEIM</div><div class="edition">HOST · MOD · PLAY</div><main id="scenes"></main><div class="footer"><span>UI TOUR · CONDENSED WORKFLOW</span><span id="count"></span></div><div class="progress"></div></div>
<script>
const asset=n=>'../docs/assets/'+n;
const shot=(file,cls='')=>`<div class="shot ${cls}"><img src="${asset(file)}" alt="PhValheim interface"></div>`;
const note=t=>`<div class="note">${t}</div>`;
const tags=arr=>`<div class="tagrow">${arr.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
const tiles=arr=>`<div class="grid">${arr.map(([a,b])=>`<div class="tile">${a}<small>${b}</small></div>`).join('')}</div>`;
const flow=arr=>`<div class="stack">${arr.map(([a,b],i)=>`<div class="flow"><b>${i+1}</b><div>${a}<small>${b}</small></div></div>`).join('')}</div>`;
const art={
 intro:()=>`<div class="crest"><img src="${asset('favicon.svg')}" alt="PhValheim"></div><div class="strap">HOST. MOD. SYNC. PLAY.</div>`+note('One home for your Valheim worlds.'),
 create:()=>shot('tour-create.png','tall')+note('Separate adventures. One PhValheim server.'),
 worlds:()=>tags(['Multiple worlds','Vanilla + modded'])+shot('tour-world-row.png','world')+tiles([['Per-world setup','Mods · configs · access'],['World controls','Start · stop · update']])+note('All from your browser.'),
 options:()=>shot('tour-world-options.png')+tags(['Passwords','Server listing','Launch parameters'])+note('Independent settings for every world.'),
 automation:()=>shot('tour-world-updates.png')+note('Choose when each world can update.'),
 mods:()=>shot('tour-mods.png')+tags(['3 catalogues','Version pins','Dependencies'])+note('Save the selection. Update the world.'),
 configs:()=>shot('tour-configs.png','config')+note('Save & apply to players → sync next launch.'),
 distribution:()=>flow([['Choose the setup','Mods + versions + shared settings'],['Build the world payload','Dependencies resolved and files packaged'],['Deliver to your players','The client downloads the world’s payload']])+note('Server-only configurations stay on the server.'),
 client:()=>flow([['Sign in with Steam','Open your host’s PhValheim website'],['Choose your world','Launch opens the PhValheim client'],['Sync, then launch','Updated mods + configs before the game']])+tags(['Windows','Linux','macOS'])+note('Vanilla worlds use ordinary Valheim.'),
 backups:()=>shot('tour-world-backup-policy.png','backups')+tiles([['Backup policy','Schedule · retention'],['Player access','Citizens · admins · bans']])+note('Back up. Restore. Get back to exploring.'),
 helper:()=>`<img class="hero-bird" src="${asset('hugin.svg')}" alt="Hugin">`+tiles([['Investigate','Worlds · backups · logs'],['Review','Approve proposed changes']])+note('Optional hosted or self-hosted AI.'),
 vibes:()=>shot('vibes-workbench.png','vibes')+tags(['Write · build · package','Publish locally'])+note('Select your mod. Update. Sync. Play.'),
 local:()=>shot('vibes-package.png','package')+flow([['Publish to your local catalogue','Your code · your Git history'],['Select → update → sync','Try it on a test world']]),
 outro:()=>`<div class="crest"><img src="${asset('favicon.svg')}" alt="PhValheim"></div><div class="url">Get started<br><strong>phvalheim.com</strong></div><div class="credit">Music: Viking Intro (Loop) · Alexander Nakarada<br>CC BY 4.0 · Full credit in the description</div>`
};
window.initTour=data=>{
 window.TOUR_DURATION=data.length*5;
 document.querySelector('#scenes').innerHTML=data.map((s,i)=>`<section class="scene" data-kind="${s.kind}"><div class="step">${s.step}</div><h1>${s.title}</h1><p class="sub">${s.sub}</p><div class="art">${art[s.kind]()}</div></section>`).join('');
 document.querySelector('.progress').innerHTML=data.map(()=>'<i><b></b></i>').join('');
 window.setTime=t=>{const n=Math.min(data.length-1,Math.floor(t/5));document.querySelectorAll('.scene').forEach((e,i)=>e.classList.toggle('active',i===n));document.querySelectorAll('.progress b').forEach((e,i)=>e.style.width=Math.max(0,Math.min(100,(t-i*5)/5*100))+'%');document.querySelector('#count').textContent=String(n+1).padStart(2,'0')+' / '+data.length};setTime(0);
 window.startTour=()=>{const start=performance.now();function tick(){setTime((performance.now()-start)/1000);if(performance.now()-start<TOUR_DURATION*1000)requestAnimationFrame(tick)}tick()};
};
</script></html>
