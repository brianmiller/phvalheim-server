name: Disposable container integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'container/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.dev.yaml'
      - 'dev_tools/test-public-security-integration.py'
      - 'dev_tools/test-game-port-integration.py'
      - 'dev_tools/fixture_presentation.py'
      - 'dev_tools/test-server-settings-browser.py'
      - 'dev_tools/test-public-entry-browser.py'
      - 'dev_tools/fixture_analytics.py'
      - 'dev_tools/fixture-analytics.sh'
      - 'dev_tools/fixtures/analytics-disabled.sh'
      - 'dev_tools/test-fixture-analytics*.py'
      - '.github/workflows/container-integration.yml'
  push:
    branches: [master]
    paths:
      - 'container/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.dev.yaml'
      - 'dev_tools/test-public-security-integration.py'
      - 'dev_tools/test-game-port-integration.py'
      - 'dev_tools/fixture_presentation.py'
      - 'dev_tools/test-server-settings-browser.py'
      - 'dev_tools/test-public-entry-browser.py'
      - 'dev_tools/fixture_analytics.py'
      - 'dev_tools/fixture-analytics.sh'
      - 'dev_tools/fixtures/analytics-disabled.sh'
      - 'dev_tools/test-fixture-analytics*.py'
      - '.github/workflows/container-integration.yml'
permissions:
  contents: read
jobs:
  integration:
    name: Public security and game ports (real HTTP/DB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the checkout without publishing
        run: |
          mkdir -p .integration-logs
          docker compose -f compose.dev.yaml config --quiet
          docker build -t phvalheim-contributor:local . 2>&1 | tee .integration-logs/build.log
      - name: Verify analytics isolation before booting fixtures
        env:
          PHV_FIXTURE_TEST_IMAGE: phvalheim-contributor:local
        run: python3 dev_tools/test-fixture-analytics-container.py 2>&1 | tee .integration-logs/analytics-isolation.log
      - name: Verify public security
        env:
          PHV_SEC_TEST_IMAGE: phvalheim-contributor:local
        run: python3 dev_tools/test-public-security-integration.py 2>&1 | tee .integration-logs/security.log
      - name: Verify allocation, exhaustion and persistence
        env:
          PHV_PORT_TEST_IMAGE: phvalheim-contributor:local
        run: python3 dev_tools/test-game-port-integration.py 2>&1 | tee .integration-logs/ports.log
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Verify Server Settings in a browser
        env:
          PHV_PRESENTATION_IMAGE: phvalheim-contributor:local
          PHV_PRESENTATION_FIXTURE: .integration-logs/settings-fixture.json
        run: |
          python3 dev_tools/fixture_presentation.py 2>&1 | tee .integration-logs/settings-fixture.log
          python3 dev_tools/test-server-settings-browser.py 2>&1 | tee .integration-logs/settings-browser.log
          python3 dev_tools/test-public-entry-browser.py 2>&1 | tee .integration-logs/public-entry-browser.log
      - name: Clean up settings fixture
        if: always()
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          path = Path('.integration-logs/settings-fixture.json')
          if path.exists():
              fixture = json.loads(path.read_text())
              subprocess.run(['docker', 'rm', '-f', fixture['name']], check=False)
              subprocess.run(['docker', 'volume', 'rm', fixture['volume']], check=False)
          PY
          cp /tmp/phv-settings-*.png .integration-logs/ 2>/dev/null || true
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-integration-logs
          path: .integration-logs/
          include-hidden-files: true
      - name: State coverage limits
        if: always()
        run: echo 'These checks do not run Steam sign-in, live Valheim, Windows or macOS clients, or every engine test.' >> "$GITHUB_STEP_SUMMARY"
